; PLANTILLA / TEMPLATE — preset de exportación para Android.
; ES: copia este bloque dentro de tu export_presets.cfg (cambia "preset.1" por el número libre que sigue)
;     o, mejor, crea el preset desde el editor: Proyecto > Exportar > Añadir > Android, y activa los permisos de abajo.
; EN: copy this block into your export_presets.cfg (rename "preset.1" to the next free number),
;     or create it in the editor: Project > Export > Add > Android, and enable the permissions below.

[preset.1]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/Sanatorio.apk"

[preset.1.options]

gradle_build/use_gradle_build=false
package/unique_name="com.sanatorio.game"
package/name="Sanatorio"
architectures/arm64-v8a=true
architectures/armeabi-v7a=false
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/record_audio=true
permissions/internet=true
permissions/access_network_state=true
permissions/access_wifi_state=true
